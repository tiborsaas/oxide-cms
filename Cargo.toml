[package]
name = "oxide-cms"
version = "0.0.1"
edition = "2024"
description = "An embeddable, headless Content Management System library for Rust applications built on Axum and SQLite."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiborsaas/oxide-cms"
homepage = "https://github.com/tiborsaas/oxide-cms"
documentation = "https://docs.rs/oxide-cms"
readme = "README.md"
keywords = ["cms", "headless", "axum", "sqlite", "markdown"]
categories = ["web-programming::http-server", "database"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
pulldown-cmark = "0.13.5"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
