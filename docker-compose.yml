services:
  oxide-cms:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      # Internal port for Dokploy / Traefik reverse proxy
      - "3000"
    ports:
      # Defaults to host port 3001 to avoid colliding with Dokploy dashboard on 3000
      - "${HOST_PORT:-3001}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=sqlite:/data/oxide_cms.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin_secret_pass}
      - JWT_SECRET=${JWT_SECRET:-super_secret_headless_cms_jwt_key_change_in_prod}
    volumes:
      # Mount host ./data directory to /data inside container
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
