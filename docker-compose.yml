services:
  oxide-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oxide-cms
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=sqlite:/data/oxide_cms.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin_secret_pass}
      - JWT_SECRET=${JWT_SECRET:-super_secret_headless_cms_jwt_key_change_in_prod}
    volumes:
      # Mount host ./data folder to /data inside the container
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
