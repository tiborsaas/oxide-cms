<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title | default(value="Oxide Blog") }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="header-inner">
                <a href="/" class="site-brand">
                    <span class="brand-badge">⚡</span>
                    <span class="brand-name">oxide<span class="brand-accent">.blog</span></span>
                </a>
                <nav class="site-nav">
                    <a href="/" class="nav-link">Articles</a>
                    <a href="/api" class="nav-link nav-pill" target="_blank" rel="noopener">API Docs</a>
                    <a href="/api/health" class="nav-link nav-status" target="_blank" rel="noopener" title="System Health">
                        <span class="status-dot"></span>
                        <span class="status-text">Live</span>
                    </a>
                </nav>
            </div>
        </header>

        <main class="site-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="footer-inner">
                <p class="footer-copy">
                    Powered by <a href="https://github.com/tokio-rs/axum" target="_blank" rel="noopener">Axum</a>,
                    <a href="https://sqlite.org" target="_blank" rel="noopener">SQLite</a> &
                    <a href="https://github.com/Keats/tera" target="_blank" rel="noopener">Tera</a>.
                </p>
                <p class="footer-sub">A minimalist headless CMS and blog engine written in Rust.</p>
            </div>
        </footer>
    </div>
</body>
</html>
